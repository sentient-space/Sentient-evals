[project]
name = "sentient-evals"
version = "0.1.18"
description = "Universal evaluation harness for AI agents (local + embeddable)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sentient", email = "oss@sentient.ai" }]
keywords = ["ai", "agents", "evaluation", "benchmark", "harness", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "requests>=2.31",
  "packaging>=23.0",
]

[project.optional-dependencies]
llm = [
  "httpx>=0.28.1",
]
docker = [
  "docker",
]
daytona = [
  "daytona",
]
e2b = [
  "e2b",
]
modal = [
  "modal>=1.3.0.post1",
]
langchain = [
  "langchain-core",
]
crewai = [
  "crewai",
]
autogen = [
  "pyautogen",
]
interactive = [
  "InquirerPy>=0.3.4",
]

[project.scripts]
sentient-evals = "sentient_evals.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_mode = "auto"
