[adapter]
type = "cursor-cli"
kwargs = { model_name = "cursor/composer-1", install_timeout_s = 600, run_timeout_s = 600 }

[[graders]]
type = "verifier_script"
config = {}

[[graders]]
type = "exact_match"
config = { expected = "OK", field = "answer" }

[[graders]]
type = "state_check"
config = { outcome_field = "answer", expect = { "$contains" = "OK" } }

[[graders]]
type = "static_analysis"
config = { checks = [{ name = "agent_log_exists", cmd = "test -f /logs/agent/cursor-cli.txt" }] }

[[graders]]
type = "tool_usage"
config = { max_turns = 10 }

[[graders]]
type = "budget"
config = {}

[[graders]]
type = "human_review"
config = {}

[[graders]]
type = "llm_judge"
config = { rubric = "Pass iff the MODEL ANSWER contains a standalone OK and no other meaningful content.", judge = { model = "openai/gpt-4o-mini", api_key_env = "OPENAI_API_KEY", max_tokens = 256, temperature = 0.0 } }

